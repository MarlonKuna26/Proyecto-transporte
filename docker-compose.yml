version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: u-ride-db
    environment:
      POSTGRES_USER: ${DB_USER:-u_ride_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      POSTGRES_DB: ${DB_NAME:-u_ride_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-u_ride_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - u-ride-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: u-ride-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uride.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: 1
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - u-ride-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  u-ride-network:
    driver: bridge
