services:
  postgres:
    image: postgres:16-alpine
    container_name: u-ride-db
    environment:
      POSTGRES_USER: ${DB_USER:-u_ride_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      POSTGRES_DB: ${DB_NAME:-u_ride_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./base_completa.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-u_ride_user} -d ${DB_NAME:-u_ride_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - u-ride-network
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-u-ride-backend:latest}
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: u-ride-backend
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-u_ride_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      DB_NAME: ${DB_NAME:-u_ride_dev}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_jenkins}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_in_jenkins}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    ports:
      - "${BACKEND_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - u-ride-network
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-u-ride-frontend:latest}
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3002/api/v1}
    container_name: u-ride-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - u-ride-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  u-ride-network:
    driver: bridge
