services:
  database:
    image: postgres:15-alpine
    container_name: u-ride-db-jenkins  # ✅ Nombre diferente
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-182004}
      POSTGRES_DB: ${DB_NAME:-u_ride_esp}
    ports:
      - "5434:5432"  # ✅ Puerto diferente para evitar conflicto
    volumes:
      - postgres_data_jenkins:/var/lib/postgresql/data  # ✅ Volumen diferente
    networks:
      - u-ride-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    # ...
    environment:
      # ✅ Apuntar al nuevo contenedor
      DB_HOST: u-ride-db-jenkins
      DB_PORT: 5432
      # ...
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data_jenkins:  # ✅ Volumen diferente

networks:
  u-ride-network:
    external: true
    name: proyecto-transporte_u-ride-network